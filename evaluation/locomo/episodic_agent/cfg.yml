long_term_memory:
  derivative_deriver: sentence
  metadata_prefix: "[$source_timestamp] $producer_id: "
  embedder: my_embedder_id
  reranker: my_reranker_id
  vector_graph_store: my_storage_id

sessiondb:
  uri: sqlitetest.db

# Profile memory not used for LoCoMo. Note: This will use some embedding tokens.
profile_memory:
  model_name: my_model_id
  database: my_db_id

model:
  my_model_id:
    model_name: "deepseek-chat"
    api_key: <DEEPSEEK_API_KEY>
storage:
  my_storage_id:
    vendor_name: neo4j
    host: localhost
    port: 7687
    user: neo4j
    password: <NEO4J_PASSWORD>
  my_db_id:
    vendor_name: postgres
    host: <POSTGRES_HOST>
    port: <POSTGRES_PORT>
    user: <POSTGRES_USER>
    password: <POSTGRES_PASS>
    database: <POSTGRES_DB>

# Session memory not used for LoCoMo. Note: This will use some chat completion tokens.
sessionmemory:
  model_name: my_model_id
  message_capacity: 50000
  max_message_length: 16000
  max_token_num: 8000

embedder:
  my_embedder_id:
    model_name: "deepseek-embedding"
    api_key: <DEEPSEEK_API_KEY>

reranker:
  my_reranker_id:
    type: "rrf-hybrid"
    reranker_ids:
      - id_ranker_id
      - bm_ranker_id
      - ce_ranker_id
  id_ranker_id:
    type: "identity"
  bm_ranker_id:
    type: "bm25"
  ce_ranker_id:
    type: "cross-encoder"
    model_name: "cross-encoder/qnli-electra-base"
